name: Gerar APK do Pista

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar arquivos do Leaflet
        run: |
          mkdir -p www/vendor
          cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css#vendor/leaflet.css#; s#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js#vendor/leaflet.js#' www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones Android
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#050A1C' --splashBackgroundColor '#050A1C'

      - name: Aplicar ajustes Android
        run: python3 scripts/android_patch.py

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pista-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
